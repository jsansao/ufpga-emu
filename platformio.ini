[rp2040_base]
platform = raspberrypi
board = pico
framework = arduino
build_flags = -DPICO_SPINLOCK_ID_EMU=4
build_src_filter = +<main_rp2040.cpp>
board_build.f_cpu = 133000000L

[env:rp2040]
extends = rp2040_base



[env:rp2040-counter]
